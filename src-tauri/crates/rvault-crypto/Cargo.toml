[package]
name = "rvault-crypto"
version = "0.1.0"
description = "Vault header, key wrapping, and object encryption"
edition = "2021"
license = "MIT"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
rand = "0.8"
ring = "0.17"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
